    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2aa7a0" stop-opacity=".35"/><stop offset="1" stop-color="#f2c48f" stop-opacity=".3"/></linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6d3a2"/></linearGradient>
    <radialGradient id="glow" cx=".85" cy=".1" r=".7"><stop offset="0" stop-color="#f2c48f" stop-opacity=".35"/><stop offset="1" stop-color="#f2c48f" stop-opacity="0"/></radialGradient>
